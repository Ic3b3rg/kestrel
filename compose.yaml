name: kestrel

x-kestrel-app: &kestrel-app
  image: kestrel-dev:local
  environment: &database-environment
    DATABASE_URL: postgres://kestrel:kestrel_dev@postgres:5432/kestrel
    EVENT_RETENTION_LIMIT: 1000

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: kestrel
      POSTGRES_PASSWORD: kestrel_dev
      POSTGRES_USER: kestrel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestrel -d kestrel"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql

  migrate:
    <<: *kestrel-app
    build:
      context: .
    command: ["npm", "run", "migrate", "-w", "@kestrel/database"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *kestrel-app
    command: ["npm", "run", "start", "-w", "@kestrel/web"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database-environment
      HOST: 0.0.0.0
      PORT: 3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  worker:
    <<: *kestrel-app
    command: ["npm", "run", "start", "-w", "@kestrel/worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  pwa:
    <<: *kestrel-app
    command: ["npm", "run", "dev", "-w", "@kestrel/pwa", "--", "--host", "0.0.0.0"]
    depends_on:
      web:
        condition: service_healthy
    environment:
      VITE_API_PROXY: http://web:3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5173:5173"
    restart: unless-stopped

volumes:
  postgres-data:
